/* Layout: ein Schulheft-Blatt auf Karopapier. Aufgabe oben groß, Eingabe darunter, Lösungsweg im Heftstil mit Umformungsspalte. */
:root{
  --bg:#eef2f4; --grid:#d5dee5; --paper:#ffffff; --ink:#1b2230; --muted:#5b6678;
  --blue:#1d48b8; --blue-soft:#e3eafb; --red:#c22f28; --red-soft:#fbe7e5; --ok:#1d7a52; --ok-soft:#e1f3ea;
  --line:#c9d3dc;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-math:"STIX Two Text", "Cambria Math", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151c; --grid:#1c2330; --paper:#181e28; --ink:#e7ebf2; --muted:#9aa5b8;
  --blue:#86a6ff; --blue-soft:#1f2b4a; --red:#ff8077; --red-soft:#3a1f1f; --ok:#5fd29a; --ok-soft:#163327;
  --line:#2c3545; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11151c; --grid:#1c2330; --paper:#181e28; --ink:#e7ebf2; --muted:#9aa5b8;
  --blue:#86a6ff; --blue-soft:#1f2b4a; --red:#ff8077; --red-soft:#3a1f1f; --ok:#5fd29a; --ok-soft:#163327;
  --line:#2c3545; color-scheme:dark }

*{box-sizing:border-box}
body{
  background-color:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;
}
.wrap{max-width:760px; margin:0 auto; padding-inline:16px; padding-block:24px 48px; display:grid; gap:18px}
header{display:flex; flex-wrap:wrap; align-items:end; justify-content:space-between; gap:8px 16px}
h1{font-family:var(--f-display); font-weight:800; font-size:clamp(1.7rem,5vw,2.3rem); line-height:1.05; margin:0; letter-spacing:-.01em; text-wrap:balance}
.sub{color:var(--muted); font-size:.92rem; margin:4px 0 0}
.stats{display:flex; gap:6px; flex-wrap:wrap}
.stat{background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:4px 10px; font-size:.82rem; color:var(--muted); font-variant-numeric:tabular-nums}
.stat b{color:var(--ink); font-size:1rem; margin-right:3px}

.levels{display:flex; flex-wrap:wrap; gap:6px}
.lv{font:inherit; font-size:.9rem; cursor:pointer; border:1.5px solid var(--line); background:var(--paper); color:var(--ink);
  border-radius:999px; padding:6px 14px; display:flex; gap:8px; align-items:baseline}
.lv small{font-family:var(--f-math); color:var(--muted); font-size:.85rem}
.lv[aria-pressed="true"]{border-color:var(--blue); background:var(--blue-soft); color:var(--blue); font-weight:700}
.lv[aria-pressed="true"] small{color:var(--blue)}
.lv:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--blue); outline-offset:2px}

.sheet{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:22px clamp(16px,4vw,32px) 24px; display:grid; gap:18px; box-shadow:0 1px 0 var(--line)}
.task-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; font-size:.82rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em}
.eq-big{font-family:var(--f-math); font-size:clamp(1.9rem,7vw,2.8rem); text-align:center; padding:10px 0 4px; overflow-x:auto; white-space:nowrap}
.fr{display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; line-height:1.1; margin:0 .08em}
.fr>span{padding:0 .15em}
.fr>span:first-child{border-bottom:.06em solid currentColor}
.fr>span:last-child{font-size:.95em}

form.answer{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center}
.xeq{font-family:var(--f-math); font-size:1.7rem; font-style:italic}
.field{display:flex; align-items:stretch}
#ans{font-family:var(--f-math); font-size:1.5rem; width:8.5rem; padding:6px 12px; border:2px solid var(--line); border-right:none; border-radius:8px 0 0 8px; background:var(--paper); color:var(--ink)}
#ans:focus{border-color:var(--blue)}
.pm{font:inherit; font-size:1.1rem; border:2px solid var(--line); border-radius:0 8px 8px 0; background:var(--bg); color:var(--ink); padding:0 12px; cursor:pointer}
.btn{font:inherit; font-weight:700; cursor:pointer; border-radius:8px; padding:10px 18px; border:2px solid var(--blue); background:var(--blue); color:var(--paper)}
.btn.ghost{background:transparent; color:var(--blue)}
.btn:disabled{opacity:.45; cursor:default}
.actions{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}

.fb{border-radius:8px; padding:12px 16px; font-size:1rem; display:grid; gap:4px}
.fb.ok{background:var(--ok-soft); color:var(--ok)}
.fb.no{background:var(--red-soft); color:var(--red)}
.fb.info{background:var(--blue-soft); color:var(--blue)}
.fb strong{font-family:var(--f-display); font-size:1.15rem}
.fb .probe{font-family:var(--f-math); font-size:1.05rem; color:var(--ink)}

.steps-wrap{overflow-x:auto}
.steps-title{font-family:var(--f-display); font-weight:600; font-size:1.05rem; margin:0 0 6px}
.steps{display:grid; grid-template-columns:auto auto auto 1fr; column-gap:10px; row-gap:2px; font-family:var(--f-math); font-size:1.3rem; align-items:center; min-width:min-content}
.steps .l{text-align:right; white-space:nowrap}
.steps .r{white-space:nowrap}
.steps .op{border-left:2px solid var(--blue); padding:4px 0 4px 12px; color:var(--blue); font-size:1.05rem}
.steps .op .note{display:block; font-family:var(--f-body); font-size:.82rem; color:var(--muted); line-height:1.3; max-width:30ch}
.steps .final{color:var(--ok); font-weight:600}
.steps .final.hiddenans{color:var(--muted)}

footer{font-size:.82rem; color:var(--muted); text-align:center}
.linkbtn{font:inherit; background:none; border:none; color:var(--muted); text-decoration:underline; cursor:pointer; padding:0}

@media (max-width:520px){
  .steps{font-size:1.1rem; grid-template-columns:auto auto auto auto}
  .steps .op .note{max-width:18ch}
}
@media (prefers-reduced-motion:no-preference){
  .fb,.steps>*{animation:fade .25s ease}
  @keyframes fade{from{opacity:.3; transform:translateY(3px)}to{opacity:1; transform:none}}
}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Gleichungstrainer</h1>
      <p class="sub">Mathematik · EESA · Lineare Gleichungen üben</p>
    </div>
    <div class="stats" aria-live="polite">
      <span class="stat"><b id="sOk">0</b>richtig</span>
      <span class="stat"><b id="sHelp">0</b>mit Hilfe</span>
      <span class="stat"><b id="sStreak">0</b>Serie</span>
    </div>
  </header>

  <nav class="levels" aria-label="Schwierigkeitsstufe">
    <button class="lv" data-lv="1" aria-pressed="true">1 Grundform <small>4x + 9 = 33</small></button>
    <button class="lv" data-lv="2" aria-pressed="false">2 x auf beiden Seiten <small>5x − 7 = 2x + 8</small></button>
    <button class="lv" data-lv="3" aria-pressed="false">3 Klammern <small>3(x − 2) = 15</small></button>
    <button class="lv" data-lv="4" aria-pressed="false">4 Brüche <small>x : 5 − 1 = 3</small></button>
    <button class="lv" data-lv="0" aria-pressed="false">Gemischt</button>
  </nav>

  <main class="sheet">
    <div class="task-head"><span id="taskNo">Aufgabe 1</span><span id="taskLv">Stufe 1 · Grundform</span></div>
    <div class="eq-big" id="eq" aria-live="polite"></div>

    <form class="answer" id="form" autocomplete="off">
      <label for="ans" class="xeq">x =</label>
      <div class="field">
        <input id="ans" type="text" inputmode="decimal" placeholder="?" aria-label="Deine Lösung für x">
        <button type="button" class="pm" id="pm" title="Vorzeichen wechseln" aria-label="Vorzeichen wechseln">±</button>
      </div>
      <button class="btn" id="check" type="submit">Prüfen</button>
    </form>

    <div id="fb" aria-live="polite" hidden></div>

    <div class="actions">
      <button class="btn ghost" id="hint" type="button">Tipp: nächster Schritt</button>
      <button class="btn ghost" id="show" type="button">Lösungsweg zeigen</button>
      <button class="btn ghost" id="next" type="button">Neue Aufgabe</button>
    </div>

    <section class="steps-wrap" id="stepsBox" hidden>
      <h2 class="steps-title">Lösungsweg</h2>
      <div class="steps" id="steps"></div>
    </section>
  </main>

  <footer>
    Jede Aufgabe wird neu ausgewürfelt und hat eine ganzzahlige Lösung. Tipp: Mit der Eingabetaste prüfen und danach weiter.
    <br><button class="linkbtn" id="reset" type="button">Zähler zurücksetzen</button>
  </footer>
</div>

<script>
const M = "−";
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const nz = (a,b) => { let v; do { v = rnd(a,b); } while (v === 0); return v; };
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const num = n => n < 0 ? M + Math.abs(n) : String(n);
const xTerm = a => a === 1 ? "x" : a === -1 ? M + "x" : num(a) + "x";
const xs = a => (Math.abs(a) === 1 ? "" : Math.abs(a)) + "x";
function lin(a, b){
  if (a === 0) return num(b);
  let s = xTerm(a);
  if (b > 0) s += " + " + b; else if (b < 0) s += " " + M + " " + (-b);
  return s;
}
function joinTerms(ts){
  let s = "";
  ts.forEach((t,i) => {
    const body = t.x ? xs(t.c) : String(Math.abs(t.c));
    if (i === 0) s += (t.c < 0 ? M : "") + body;
    else s += (t.c < 0 ? " " + M + " " : " + ") + body;
  });
  return s || "0";
}
const br = (p, m, q) => (p === 1 ? "" : p === -1 ? M : num(p)) + "(" + lin(m, q) + ")";
const frac = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const gcd = (a,b) => b ? gcd(b, a % b) : Math.abs(a);
const lcm = (a,b) => a*b / gcd(a,b);
const subOp = e => e > 0 ? "| " + M + e : "| +" + (-e);
const subXOp = c => c > 0 ? "| " + M + xs(c) : "| +" + xs(c);
const divOp = k => k < 0 ? "| :(" + M + (-k) + ")" : "| :" + k;

class Steps {
  constructor(){ this.lines = []; }
  add(l, r){ this.lines.push({ l, r, op: "", note: "" }); }
  op(op, note){ const x = this.lines[this.lines.length-1]; x.op = op; x.note = note; }
}

// Löst "A·x + B = C·x + D" schrittweise, ausgehend von der zuletzt notierten Zeile.
function solveLin(S, A, B, C, D){
  if (A !== 0 && C !== 0){
    if (A > C){
      S.op(subXOp(C), C > 0 ? `Ziehe auf beiden Seiten ${xs(C)} ab. Dann steht x nur noch links.` : `Addiere auf beiden Seiten ${xs(C)}. Dann steht x nur noch links.`);
      A -= C; C = 0;
    } else {
      S.op(subXOp(A), A > 0 ? `Ziehe auf beiden Seiten ${xs(A)} ab. Dann steht x nur noch rechts.` : `Addiere auf beiden Seiten ${xs(A)}. Dann steht x nur noch rechts.`);
      C -= A; A = 0;
    }
    S.add(lin(A, B), lin(C, D));
  }
  const left = A !== 0;
  const k = left ? A : C, e = left ? B : D;
  let f = left ? D : B;
  if (e !== 0){
    S.op(subOp(e), e > 0 ? `Ziehe auf beiden Seiten ${e} ab.` : `Addiere auf beiden Seiten ${-e}.`);
    f -= e;
    left ? S.add(xTerm(k), num(f)) : S.add(num(f), xTerm(k));
  }
  if (k !== 1){
    S.op(divOp(k), k === -1 ? `Teile beide Seiten durch ${M}1. Dabei drehen sich die Vorzeichen um.` : `Teile beide Seiten durch ${num(k)}.`);
    S.add("x", num(f / k));
  } else if (!left){
    S.op("", "Seiten tauschen.");
    S.add("x", num(f));
  }
}

const GEN = {
  1(){ // a·x + b = c, manchmal c = a·x + b
    const a = rnd(2,9), x = rnd(1,12), b = nz(-20,20), c = a*x + b;
    const S = new Steps();
    if (Math.random() < .25){
      S.add(num(c), lin(a,b)); solveLin(S, 0, c, a, b);
      return { l: num(c), r: lin(a,b), S, x, L: () => c, R: v => a*v + b };
    }
    S.add(lin(a,b), num(c)); solveLin(S, a, b, 0, c);
    return { l: lin(a,b), r: num(c), S, x, L: v => a*v + b, R: () => c };
  },
  2(){ // a·x + b = c·x + d
    let a, c;
    do { a = rnd(2,9); c = rnd(-3,8); } while (c === a || c === 0 || Math.abs(a-c) > 8);
    if (Math.random() < .3) [a, c] = [c, a];
    const x = nz(-6,10), b = nz(-15,15), d = a*x + b - c*x;
    const S = new Steps(); S.add(lin(a,b), lin(c,d)); solveLin(S, a, b, c, d);
    return { l: lin(a,b), r: lin(c,d), S, x, L: v => a*v + b, R: v => c*v + d };
  },
  3(){
    const t = pick([1,2,2,3]);
    const S = new Steps();
    if (t === 1){ // p(mx + q) = r  oder  = cx + d
      const p = rnd(2,6), m = rnd(1,3), q = nz(-9,9), x = nz(-5,9);
      let c = 0, d;
      if (Math.random() < .5){ do { c = rnd(1,5); } while (c === p*m); }
      d = p*(m*x + q) - c*x;
      const l = br(p,m,q), r = lin(c,d);
      S.add(l, r); S.op("Klammer auflösen", `Multipliziere jedes Glied in der Klammer mit ${p}.`);
      S.add(lin(p*m, p*q), r); solveLin(S, p*m, p*q, c, d);
      return { l, r, S, x, L: v => p*(m*v + q), R: v => c*v + d };
    }
    if (t === 2){ // p(mx + q) ± (nx + s) = r
      let p, m, n, sg, A;
      do { p = rnd(2,5); m = rnd(1,3); n = rnd(1,3); sg = Math.random() < .75 ? -1 : 1; A = p*m + sg*n; } while (A <= 0);
      const q = nz(-9,9), s = nz(-9,9), x = nz(-4,8), B = p*q + sg*s, r = A*x + B;
      const l = br(p,m,q) + (sg < 0 ? " " + M + " " : " + ") + "(" + lin(n,s) + ")";
      S.add(l, num(r));
      S.op("Klammern auflösen", sg < 0 ? "Achtung: Das Minus vor der zweiten Klammer dreht beide Vorzeichen in der Klammer um." : "Ein Plus vor der Klammer ändert nichts. Die Klammer darf einfach weg.");
      S.add(joinTerms([{c:p*m,x:1},{c:p*q},{c:sg*n,x:1},{c:sg*s}]), num(r));
      S.op("zusammenfassen", "Fasse die x-Glieder und die Zahlen zusammen.");
      S.add(lin(A,B), num(r)); solveLin(S, A, B, 0, r);
      return { l, r: num(r), S, x, L: v => p*(m*v + q) + sg*(n*v + s), R: () => r };
    }
    // u − p(x + q) = cx + d
    const u = rnd(2,15), p = rnd(2,5), q = nz(-8,8), c = rnd(1,6), x = nz(-4,8);
    const A = -p, B = u - p*q, d = A*x + B - c*x;
    const l = u + " " + M + " " + br(p,1,q), r = lin(c,d);
    S.add(l, r); S.op("Klammer auflösen", `Minus vor der Klammer: Multipliziere jedes Glied mit ${M}${p}. Die Vorzeichen drehen sich um.`);
    S.add(joinTerms([{c:u},{c:-p,x:1},{c:-p*q}]), r);
    S.op("zusammenfassen", "Fasse die Zahlen zusammen.");
    S.add(lin(A,B), r); solveLin(S, A, B, c, d);
    return { l, r, S, x, L: v => u - p*(v + q), R: v => c*v + d };
  },
  4(){
    const t = pick([1,1,2,3,4]);
    const S = new Steps();
    if (t === 1){ // x/a + b = c
      const a = rnd(2,6), k = nz(-3,9), x = a*k, b = nz(-9,9), c = k + b;
      const l = frac("x", a) + (b > 0 ? " + " + b : " " + M + " " + (-b));
      S.add(l, num(c)); S.op(subOp(b), b > 0 ? `Ziehe auf beiden Seiten ${b} ab.` : `Addiere auf beiden Seiten ${-b}.`);
      S.add(frac("x", a), num(k)); S.op("| ·" + a, `Multipliziere beide Seiten mit ${a}. So verschwindet der Bruch.`);
      S.add("x", num(x));
      return { l, r: num(c), S, x, L: v => v/a + b, R: () => c };
    }
    if (t === 2){ // (x + b)/a = c
      const a = rnd(2,6), c = nz(-5,8), b = nz(-9,9), x = a*c - b;
      const l = frac(lin(1,b), a);
      S.add(l, num(c)); S.op("| ·" + a, `Multipliziere beide Seiten mit ${a}. So verschwindet der Bruch.`);
      S.add(lin(1,b), num(a*c)); solveLin(S, 1, b, 0, a*c);
      return { l, r: num(c), S, x, L: v => (v + b)/a, R: () => c };
    }
    if (t === 3){ // x/a ± x/b = c
      const [a, b] = pick([[2,3],[2,4],[3,4],[2,6],[3,6],[4,6],[2,5]]);
      const L = lcm(a,b), sg = Math.random() < .7 ? 1 : -1, x = L * nz(-3,6);
      const c = x/a + sg*x/b, ka = L/a, kb = sg*L/b;
      const l = frac("x", a) + (sg > 0 ? " + " : " " + M + " ") + frac("x", b);
      S.add(l, num(c)); S.op("| ·" + L, `Multipliziere beide Seiten mit dem Hauptnenner ${L}. So verschwinden die Brüche.`);
      S.add(joinTerms([{c:ka,x:1},{c:kb,x:1}]), num(c*L));
      S.op("zusammenfassen", "Fasse die x-Glieder zusammen.");
      S.add(xTerm(ka+kb), num(c*L)); solveLin(S, ka+kb, 0, 0, c*L);
      return { l, r: num(c), S, x, L: v => v/a + sg*v/b, R: () => c };
    }
    // (x + p)/a − (x + s)/b = c, wie die Bonusaufgabe
    let a, b, p, s, x, c, L;
    do {
      [a, b] = pick([[2,3],[3,2],[2,5],[3,4],[4,3]]);
      p = nz(-6,6); s = nz(-6,6); x = nz(-8,12); L = lcm(a,b);
      c = ((x + p)*(L/a) - (x + s)*(L/b)) / L;
    } while (!Number.isInteger(c) || (L/a - L/b) === 0);
    const na = L/a, nb = L/b, A = na - nb, B = na*p - nb*s;
    const l = frac(lin(1,p), a) + " " + M + " " + frac(lin(1,s), b);
    S.add(l, num(c)); S.op("| ·" + L, `Multipliziere beide Seiten mit dem Hauptnenner ${L}. Jeder Zähler bekommt dabei einen Faktor.`);
    S.add(br(na,1,p) + " " + M + " " + br(nb,1,s), num(c*L));
    S.op("Klammern auflösen", "Achtung: Das Minus vor der zweiten Klammer dreht beide Vorzeichen um.");
    S.add(joinTerms([{c:na,x:1},{c:na*p},{c:-nb,x:1},{c:-nb*s}]), num(c*L));
    S.op("zusammenfassen", "Fasse die x-Glieder und die Zahlen zusammen.");
    S.add(lin(A,B), num(c*L)); solveLin(S, A, B, 0, c*L);
    return { l, r: num(c), S, x, L: v => (v + p)/a - (v + s)/b, R: () => c };
  }
};
const LV_NAME = {1:"Grundform", 2:"x auf beiden Seiten", 3:"Klammern", 4:"Brüche"};

// Zustand
let level = 1, task = null, taskLevel = 1, count = 0, shown = 0, wrong = 0, solved = false, helped = false;
let stats = { ok: 0, help: 0, streak: 0 };
try { const s = JSON.parse(localStorage.getItem("gt-stats")); if (s) stats = Object.assign(stats, s); } catch(e){}
try { const l = Number(localStorage.getItem("gt-level")); if ([0,1,2,3,4].includes(l)) level = l; } catch(e){}
const save = () => { try { localStorage.setItem("gt-stats", JSON.stringify(stats)); localStorage.setItem("gt-level", String(level)); } catch(e){} };

const $ = id => document.getElementById(id);
const fmt = v => { const r = Math.round(v*100)/100; return (r < 0 ? M : "") + String(Math.abs(r)).replace(".", ","); };

function renderStats(){ $("sOk").textContent = stats.ok; $("sHelp").textContent = stats.help; $("sStreak").textContent = stats.streak; }

function newTask(){
  taskLevel = level || rnd(1,4);
  let t; do { t = GEN[taskLevel](); } while (task && t.l === task.l && t.r === task.r);
  task = t; count++; shown = -1; wrong = 0; solved = false; helped = false;
  $("eq").innerHTML = `${task.l} = ${task.r}`;
  $("taskNo").textContent = "Aufgabe " + count;
  $("taskLv").textContent = "Stufe " + taskLevel + " · " + LV_NAME[taskLevel];
  $("ans").value = ""; $("ans").disabled = false; $("check").disabled = false; $("pm").disabled = false;
  $("fb").hidden = true; $("stepsBox").hidden = true; $("hint").disabled = false; $("show").disabled = false;
  $("next").classList.add("ghost");
  $("ans").focus({ preventScroll: true });
}

function renderSteps(n){
  const lines = task.S.lines, box = $("steps");
  box.innerHTML = "";
  const last = lines.length - 1;
  lines.forEach((ln, i) => {
    if (i > n) return;
    const isFinal = i === last;
    const cls = isFinal ? "final" : "";
    const add = (c, html) => { const d = document.createElement("div"); d.className = c; d.innerHTML = html; box.appendChild(d); };
    add("l " + cls, ln.l); add(cls, "="); add("r " + cls, ln.r);
    add("op", ln.op || ln.note ? `${ln.op}${ln.note ? `<span class="note">${ln.note}</span>` : ""}` : "");
  });
  $("stepsBox").hidden = false;
}

function feedback(kind, title, text, probe){
  const fb = $("fb");
  fb.className = "fb " + kind; fb.hidden = false;
  fb.innerHTML = `<strong>${title}</strong>${text ? `<span>${text}</span>` : ""}${probe ? `<span class="probe">${probe}</span>` : ""}`;
}

function parse(s){
  s = s.replace(/\s/g, "").replace(/^x=/i, "").replace(/[−–]/g, "-").replace(/,/g, ".");
  if (/^[+-]?\d+(\.\d+)?\/[+-]?\d+(\.\d+)?$/.test(s)){ const [a,b] = s.split("/").map(Number); return b ? a/b : NaN; }
  if (/^[+-]?\d+(\.\d+)?$/.test(s) || /^[+-]?\.\d+$/.test(s)) return Number(s);
  return NaN;
}

function probeText(v){
  const l = task.L(v), r = task.R(v);
  return `Probe mit x = ${fmt(v)}:  links ${fmt(l)},  rechts ${fmt(r)}`;
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  if (solved){ newTask(); return; }
  const v = parse($("ans").value);
  if (Number.isNaN(v)){
    feedback("info", "Bitte gib eine Zahl ein.", "Zum Beispiel 6, −3 oder 2,5.");
    return;
  }
  if (Math.abs(v - task.x) < 1e-9){
    solved = true;
    if (helped){ stats.help++; stats.streak = 0; } else { stats.ok++; stats.streak++; }
    save(); renderStats();
    const praise = helped ? "Richtig, mit Hilfe gelöst." : stats.streak >= 3 ? `Richtig! ${stats.streak} in Folge.` : "Richtig!";
    feedback("ok", praise, "Beide Seiten ergeben denselben Wert.", probeText(v) + "  ✓");
    $("ans").disabled = true; $("check").disabled = true; $("pm").disabled = true; $("hint").disabled = true;
    $("next").classList.remove("ghost"); $("next").focus();
    return;
  }
  wrong++; stats.streak = 0; save(); renderStats();
  let text = "Setze deine Zahl ein. Die beiden Seiten sind nicht gleich.";
  if (Math.abs(v + task.x) < 1e-9) text = "Fast! Prüfe das Vorzeichen.";
  else if (wrong >= 2) text = "Hol dir einen Tipp: Er zeigt dir den nächsten Rechenschritt.";
  feedback("no", "Leider nicht.", text, probeText(v) + "  ✗");
  $("ans").select();
});

$("pm").addEventListener("click", () => {
  const a = $("ans"); let s = a.value.trim();
  if (/^[−-]/.test(s)) s = s.slice(1); else s = M + s;
  a.value = s; a.focus();
});

$("hint").addEventListener("click", () => {
  helped = true;
  const last = task.S.lines.length - 1;
  shown = Math.min(shown + 1, last - 1);
  // Die letzte Zeile (das Ergebnis) bleibt beim Tipp verborgen.
  renderSteps(shown);
  if (shown >= last - 1) $("hint").disabled = true;
});

$("show").addEventListener("click", () => {
  helped = true; shown = task.S.lines.length - 1;
  renderSteps(shown); $("hint").disabled = true; $("show").disabled = true;
});

$("next").addEventListener("click", newTask);

document.querySelectorAll(".lv").forEach(b => b.addEventListener("click", () => {
  level = Number(b.dataset.lv);
  document.querySelectorAll(".lv").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  save(); count = 0; newTask();
}));

$("reset").addEventListener("click", () => { stats = { ok: 0, help: 0, streak: 0 }; save(); renderStats(); });

document.querySelectorAll(".lv").forEach(x => x.setAttribute("aria-pressed", Number(x.dataset.lv) === level ? "true" : "false"));
renderStats();
newTask();
</script>
